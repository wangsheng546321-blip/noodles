name: Publish GlobalPulse Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "output/globalpulse-dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish static site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/globalpulse-pages
          mkdir -p /tmp/globalpulse-pages
          cp -R output/globalpulse-dashboard/. /tmp/globalpulse-pages/
          cd /tmp/globalpulse-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy GlobalPulse Dashboard"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
